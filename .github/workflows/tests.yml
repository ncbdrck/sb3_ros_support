name: tests

on:
  push:
    branches: [main, master, gymnasium, tier2-2026]
  pull_request:
    branches: [main, master, gymnasium, tier2-2026]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.8 = ROS Noetic's bundled Python (the only runtime where
        # the framework actually works against real rospy / Gazebo).
        # 3.10 = forward-compat smoke test for the day the framework
        # ports to ROS 2 (the test suite stubs rospy so it can run on
        # newer Pythons even though real-world use is 3.8-only).
        python-version: ["3.8", "3.10"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # setup.py imports catkin_pkg + uses distutils. Install build deps in
          # the OUTER env, then pass --no-build-isolation to pip install so the
          # build subprocess can see them.
          pip install setuptools wheel catkin_pkg pytest pyyaml
          # SB3 brings torch as a transitive dep — a fairly heavy install
          # but unavoidable since sb3_ros_support imports stable_baselines3
          # at module load. ~3-5 min on first run; cached on subsequent
          # CI runs via actions/setup-python's pip cache.
          pip install stable-baselines3 numpy
          pip install -e . --no-build-isolation

      - name: Run pytest
        run: pytest tests/ -v
